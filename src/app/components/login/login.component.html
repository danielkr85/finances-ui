<div class="login-card card shadow-sm mx-auto">
  <div class="card-body p-4">
    <h1 class="h4 mb-4 text-center">Sign in to Finances</h1>

    @if (notice && !error()) {
      <div class="alert alert-success py-2" role="status">{{ notice }}</div>
    }
    @if (error()) {
      <div class="alert alert-danger py-2" role="alert">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input
          id="email"
          type="email"
          class="form-control"
          formControlName="email"
          autocomplete="username"
          [class.is-invalid]="form.controls.email.invalid && form.controls.email.touched"
        />
        <div class="invalid-feedback">Enter a valid email address.</div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input
          id="password"
          type="password"
          class="form-control"
          formControlName="password"
          autocomplete="current-password"
          [class.is-invalid]="form.controls.password.invalid && form.controls.password.touched"
        />
        <div class="invalid-feedback">Enter your password.</div>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
        }
        Sign in
      </button>
    </form>

    @if (googleEnabled) {
      <div class="divider my-4 text-body-secondary small">or</div>
      <div class="d-flex justify-content-center" #googleButton></div>
    }
  </div>
</div>
